[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keeptray"
version = "0.1.83"
description = "Google Keep menu bar app"
requires-python = ">=3.11"
dependencies = [
    "gkeepapi>=0.16.0,<0.17",
    "PyQt6>=6.6.0,<7",
    "keyring>=24.0.0,<26",
    "requests>=2.31.0,<3",
    "playwright>=1.40.0,<2",
    "pyobjc-framework-Cocoa>=10.0,<12; sys_platform == 'darwin'",
    "rumps>=0.4.0,<1; sys_platform == 'darwin'",
    "pystray>=0.19.0,<1; sys_platform == 'win32'",
    "pillow>=10.0.0,<12; sys_platform == 'win32'",
    "python-docx>=1.1.0,<2",
    "python-hwpx>=2.9.0,<3",
]

[project.scripts]
keeptray = "keeptray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
