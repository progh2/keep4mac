[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keep4mac"
version = "0.1.23"
description = "Google Keep macOS menu bar app"
requires-python = ">=3.11"
dependencies = [
    "gkeepapi>=0.16.0",
    "PyQt6>=6.6.0",
    "keyring>=24.0.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.scripts]
keep4mac = "keep4mac.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
